# NEDF3 offline processing (vision gripper width, latency, alignment) -> NEDF3 output.
#
# Run from repository root with a verified data-processing runtime profile:
#   python3 scripts/diagnostics/runtime_profiles.py run \
#     --role data-processing -- incubator/nedf3/nedf3_processer/processed_nedf3.py \
#       --config incubator/nedf3/nedf3_processer/configs/nedf3_processed.yaml
#
# Paths under ``dataset`` / ``gripper`` may be relative to the repo root.
# ``umi_to_tcp_transform`` below is used when episode metadata has no transform (or <16 floats).
# ``gripper.module_root`` must point at the directory that contains ``detector.py``.
# Gripper values written to ``*/hand_state`` are physical width in meters
# (``visual_angle_to_width.json`` CAD + affine pipeline).

latency:
  wrist_cam_1: 0
  wrist_cam_2: 0
  global_cam: 0

dataset:
  data_dir: data/0518_cup
  output_dir: data/0518_cup_processed
  num_demos: 0

cameras:
  wrist_cam_1: null
  wrist_cam_2: null
  global_cam: null
  wrist_image_size: [270, 360]
  global_image_size: [270, 360]

selection:
  num_demos: 0
  num_subsets: 1
  seed: 42

gripper:
  module_root: gripper_process
  width_calibration_json: configs/visual_angle_to_width.json
  left:
    camera: observation.images.wrist_image_1
    masks_dir: output_masks/left
    cfg_json: output_masks/offline_gripper_cfg.json
  right:
    camera: observation.images.wrist_image_2
    masks_dir: output_masks/right
    cfg_json: output_masks/offline_gripper_cfg.json


# Tracker→TCP (T_E_K, row-major 4×4). Used when metadata.json umi_to_tcp_transform is [].
# Order: left, then right (matches 32-float layout in the converter).
umi_to_tcp_transform:
  -  # left
    - [-0.8703688373607834, 0.33999864270667396, 0.3561727248244273, -0.08254024805757579]
    - [0.013582403061418946, -0.7064869391241801, 0.7075957342819584, -0.10512236643206652]
    - [0.4922129674016268, 0.6207069580764873, 0.610286217210514, 0.0031525662716283265]
    - [0.0, 0.0, 0.0, 1.0]
  -  # right
    - [0.8685570573971405, 0.3659820490279313, 0.33416429766648786, -0.0741883389602417]
    - [-0.02066762065355504, 0.700439071017195, -0.7134128939464786, 0.1069734213581841]
    - [-0.49515804295410665, 0.6127334229351991, 0.6159352765640018, 0.019827930842127698]
    - [0.0, 0.0, 0.0, 1.0]
