[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: fast unit tests that do not require hardware
    config: configuration and registry contract tests
    integration: mocked integration tests that avoid real hardware
    architecture: repository architecture and ownership contracts
    docs: documentation links and documented command contracts
    dependency: dependency profile ownership contracts
    model: tests requiring an optional model framework or checkpoint stack
    hardware: tests that require physical devices or vendor services
    manual: tests that must be run explicitly by an operator
addopts = -ra --import-mode=importlib --strict-markers
xfail_strict = true
