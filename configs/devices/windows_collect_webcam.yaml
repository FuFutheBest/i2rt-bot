- class: "ViveTrackerDevice"
  device_class_id: 3   # unified umi tracker device
  state_feedback:
    fps: 90.0
    buffer_size: 200
    hardware_latency_ms: 20.0    # Not currently used by data collection.
    format:
      shape: [3, 7]
      dtype: "float64"
        # left_foot, right_foot, and camera; each xyz + quaternion XYZW.
      type: [xyz, qxqyqzqw, xyz, qxqyqzqw, xyz, qxqyqzqw]
  tracker_roles: ['left_foot', 'right_foot', 'camera']    # Roles for left and right UMI trackers and ego camera
