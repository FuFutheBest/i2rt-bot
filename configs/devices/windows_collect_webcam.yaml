devices:
- class: "WebCameraDevice"
  device_class_id: 0   # left camera
  capture_id: ${camera.left_capture_id}
    # data_shape: [1440, 1080, 3]
  state_feedback:
    fps: 25.0
    buffer_size: 200
    hardware_latency_ms: 80.0
    format:
      shape: [360, 270, 3]
      dtype: "uint8"
      type: rgb
  pixel_format: "RGB8"    # Pixel format (must be set first)
  frame_rate_enable: true    # Enable frame rate control
  exposure_time: 5000.0    # Exposure time in microseconds
  gain: 16.9807    # Gain in dB
  gamma_enable: true    # Enable gamma correction
  gamma: 0.68    # Gamma value
  rotation_angle: 0    # Rotate frame clockwise (supports 0/90/180/270)

- class: "WebCameraDevice"
  device_class_id: 1   # right camera
  capture_id: ${camera.right_capture_id}
    # data_shape: [1440, 1080, 3]
  state_feedback:
    fps: 25.0
    buffer_size: 200
    hardware_latency_ms: 80.0
    format:
      shape: [360, 270, 3]
      dtype: "uint8"
      type: rgb
  pixel_format: "RGB8"    # Pixel format (must be set first)
  frame_rate_enable: true    # Enable frame rate control
  exposure_time: 5000.0    # Exposure time in microseconds
  gain: 16.9807    # Gain in dB
  gamma_enable: true    # Enable gamma correction
  gamma: 0.68    # Gamma value
  rotation_angle: 0    # Rotate frame clockwise (supports 0/90/180/270)

- class: "WebCameraDevice"
  device_class_id: 2   # ego camera
  capture_id: ${camera.ego_capture_id}
    # data_shape: [1440, 1080, 3]
