devices:
- class: "I2RTBimanualTeleop"
  device_class_id: 0
  device_name: "I2RTRobot"
  follower_device_class_id: 1
  teleoperation_config_path: ${oc.env:SI_I2RT_TELEOP_CONFIG_PATH,configs/i2rt_d405_yam_teleop.yaml}
  enable_visualizer: false
  state_feedback: &i2rt_state_feedback
    fps: 100.0
    buffer_size: 5000
    hardware_latency_ms: 0.0
    format:
      shape: [14]
      dtype: "float64"
      type: [j1-7, j1-7]
  follower_state_feedback: *i2rt_state_feedback

- class: "I2RTBimanualTeleop"
  device_class_id: 1
  device_name: "I2RTRobot"
  state_feedback: *i2rt_state_feedback
  managed_by: "I2RTBimanualTeleop_0"

- class: "RealSense"
  device_class_id: 2
  device_name: "RealSenseCamera"
  realsense_serial: ${camera.left_serial}
  state_feedback:
    fps: 30.0
    buffer_size: 200
    hardware_latency_ms: 33.0
    format:
      shape: [480, 640, 3]
      dtype: "uint8"
      type: rgb

- class: "RealSense"
  device_class_id: 3
  device_name: "RealSenseCamera"
  realsense_serial: ${camera.right_serial}
  state_feedback:
    fps: 30.0
    buffer_size: 200
    hardware_latency_ms: 33.0
    format:
      shape: [480, 640, 3]
      dtype: "uint8"
      type: rgb

- class: "RealSense"
  device_class_id: 4
  device_name: "RealSenseCamera"
  enabled: ${camera.head_enabled}
  realsense_serial: ${camera.head_serial}
  state_feedback:
    fps: 30.0
    buffer_size: 200
    hardware_latency_ms: 33.0
    format:
      shape: [480, 640, 3]
      dtype: "uint8"
      type: rgb
