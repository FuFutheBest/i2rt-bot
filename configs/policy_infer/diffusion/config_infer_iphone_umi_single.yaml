# @package _global_

defaults:
  - /devices/infer@devices: rizon_single_eef_abs_iphone_umi
  - /device_manager: sync
  - /action_executor: base
  - /consumer: default
  - /runtime: default
  - _self_

device_manager:
  device_manager:
    master_device_class_id: 1
    params:
      buffer_size: 100000

# Camera configuration - modify these to change camera IDs
camera:
  left_capture_id: 0

shared:
  summary_shm_name: device_summary_data

global_settings:
  log_level: INFO
  restart_on_failure: true
  max_restart_attempts: 3
  restart_delay: 2.0

hydra:
  run:
    dir: .
  output_subdir: null

summary_shm: device_summary_data

