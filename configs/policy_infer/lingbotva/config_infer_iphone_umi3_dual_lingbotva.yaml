# @package _global_

defaults:
  - /devices/infer@devices: rizon_dual_eef_abs_iphone_umi3
  - /device_manager: sync
  - /action_executor: base_auto_drop
  - /consumer: default
  - /runtime: default
  - _self_

device_manager:
  device_manager:
    master_device_class_id: 2
    params:
      buffer_size: 500

shared:
  summary_shm_name: device_summary_data

camera:
  left_capture_id: 0
  right_capture_id: 1

global_settings:
  log_level: INFO
  restart_on_failure: true
  max_restart_attempts: 3
  restart_delay: 2.0

hydra:
  run:
    dir: .
  output_subdir: null

summary_shm: device_summary_data

policy:
  class: LingBotVAPolicy
  params:
    # Supports:
    # 1) /path/to/run_dir                     (auto pick latest checkpoint_step_xxx)
    # 2) /path/to/checkpoint_step_xxx
    # 3) /path/to/checkpoint_step_xxx/transformer
    # ckpt_path: "/home/noematrix/ckpt/lingbotva_fastwam_mot_stack_bowl"
    # ckpt_path: "/home/noematrix/ckpt/lingbotva_fastwam_shared_stack_bowl"
    # ckpt_path: "/home/noematrix/ckpt/lingbotva_idm_mot_stack_bowl"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/lingbot_va_umi3_shared_leftright_0602_32gpu_3050master_ga3"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/lingbot-va-50h-bimanual-zipper-standard-160-junbo"
    ckpt_path: "/home/noematrix/lingbotva_ckpts/nedf3_lingbot_va_bimanual_fastwam_shared_deepspeed_packing_policy_32gpu_chunk_local_relative"
    host: 127.0.0.1
    port: 18080

    # task: "Pack at least five items into a bag"
    # task: "Take at least 5 objects from the bag or box"
    # task: "Hold the schoolbag and unzip it from the top"
    task: "Open the lid, draw a lot, and place it on the plate"
    # task: "Fold at least four towels and place them in the box"
    device: "cuda"
    camera_devices: # mapping from camera_devices to model_camera_keys
      - "IPhoneCameraDevice_0"
      - "IPhoneCameraDevice_1"
    model_camera_keys:
      - observation.images.wrist_image_1
      - observation.images.wrist_image_2
    robot_device: RizonRobot_2

    param_dtype: bf16
    attn_mode: flashattn
    enable_offload: false
    offload_vae: false
    offload_text_encoder: true
    stateless_reset_each_predict: false
    block: true

    # History KV-cache anchoring: wait until the arm physically reaches the last action
    # pose of the chunk, then sample images + robot poses backward from that moment.
    history_anchor_mode: now            # "arrival" | "now" (legacy forward-from-predict)
    history_now_base_offset_ns: 100000000
    history_now_last_keyframe_offset_ns: 500000000
    history_arrival_pos_tolerance_m: 0.01   # position tolerance (meters) for arrival
    history_arrival_rot_tolerance_rad: 0.2  # orientation tolerance (radians) for arrival
    history_arrival_timeout_s: 1.0          # give up waiting and anchor at "now" after this
    history_state_from_robot_pose: true     # build compute_kv_cache state from actual poses
    history_manual_selection:
      enabled: false
      window_ms: 600.0
      max_candidates_per_step: 15
      timeout_s: 0.0
      auto_open_browser: true
      port: 0
      save_dir: /tmp/superinference_manual_history_picker

    gripper_max_width: 0.11
    normalize_gripper_width: false

    # reshape to wxh=240x320
    reshape_mode: resize
    center_crop_before_resize: true
    crop_resize_size:
      - 240
      - 240
    pad_after_resize:
      - 0
      - 0
      - 40
      - 40

    frame_chunk_size: 4 # 2
    attn_window: 30
    guidance_scale: 5.0
    action_guidance_scale: 1.0
    num_inference_steps: 0 # 25
    action_num_inference_steps: 10 # 50

    save_root: /home/noematrix/SuperInference.lingbotva/logs/runs
    save_predicted_video_latents: false
    save_history_cache_latents: false
    decoded_latent_save_dir: /home/noematrix/SuperInference.lingbotva/logs/decoded_lingbot_latents

  fps: 100
  control_fps: 30.0 # 30.0
  chunk_length: 48 # 24

  obs:
    devices:
      - "IPhoneCameraDevice_0"
      - "IPhoneCameraDevice_1"
      - RizonRobot_2

  controls:
    - endpoint:
        device: RizonRobot
        device_class_id: 2
        port: command
      shape:
        - 16
      dtype: float64

  history_video:
    enabled: false
    save_dir: /home/noematrix/SuperInference.lingbotva/logs/history_keyframes
