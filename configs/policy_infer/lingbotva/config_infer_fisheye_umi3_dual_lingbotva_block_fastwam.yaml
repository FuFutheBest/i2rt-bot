# @package _global_

defaults:
  - /devices/infer@devices: rizon_dual_eef_abs_fisheye_webcam
  - /device_manager: sync
  - /action_executor: base_auto_drop
  - /yam_head_tracking: planned_robot_center_scaled_motion
  - /consumer: default
  - /runtime: default
  - _self_

device_manager:
  device_manager:
    master_device_class_id: 2
    params:
      buffer_size: 500

shared:
  summary_shm_name: device_summary_data

camera:
  left_capture_id: 2
  right_capture_id: 0

global_settings:
  log_level: INFO
  restart_on_failure: true
  max_restart_attempts: 3
  restart_delay: 2.0

hydra:
  run:
    dir: .
  output_subdir: null

summary_shm: device_summary_data

action_executor:
  action_executor:
    chunk_manager:
      type: base_manager
      skip_first_chunk: true

