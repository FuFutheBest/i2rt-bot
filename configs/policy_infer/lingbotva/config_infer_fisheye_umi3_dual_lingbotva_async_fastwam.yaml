# @package _global_

defaults:
  - /devices/infer@devices: rizon_dual_eef_abs_fisheye_webcam
  - /device_manager: sync
  - /action_executor: base_auto_drop
  - /yam_head_tracking: planned_robot_center_scaled_motion
  - /consumer: default
  - /runtime: default
  - _self_

device_manager:
  device_manager:
    master_device_class_id: 2
    params:
      buffer_size: 500

shared:
  summary_shm_name: device_summary_data

camera:
  left_capture_id: 1
  right_capture_id: 0

global_settings:
  log_level: INFO
  restart_on_failure: true
  max_restart_attempts: 3
  restart_delay: 2.0

hydra:
  run:
    dir: .
  output_subdir: null

summary_shm: device_summary_data

action_executor:
  action_executor:
    chunk_manager:
      type: base_manager
      drop_first_actions: 9
      skip_first_chunk: true

# action_executor:
#   action_executor:
#     chunk_manager:
#       type: auto_manager_v2
#       search_tolerance: 4
#       pos_weight: 0.4
#       rot_weight: 0.1
#       ee_weight: 0.01
#       discount_factor: 0.98
#       direction_consistency_range: 4

policy:
  class: LingBotVAPolicy
  params:
    # Supports:
    # 1) /path/to/run_dir                     (auto pick latest checkpoint_step_xxx)
    # 2) /path/to/checkpoint_step_xxx
    # 3) /path/to/checkpoint_step_xxx/transformer
    # ckpt_path: "/home/noematrix/ckpt/lingbotva_fastwam_mot_stack_bowl"
    # ckpt_path: "/home/noematrix/ckpt/lingbotva_fastwam_shared_stack_bowl"
    # ckpt_path: "/home/noematrix/ckpt/lingbotva_idm_mot_stack_bowl"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/lingbot_va_umi3_shared_leftright_0602_32gpu_3050master_ga3"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/lingbot-va-50h-bimanual-zipper-standard-160-junbo"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/nedf3_lingbot_va_bimanual_fastwam_shared_deepspeed_packing_policy_32gpu_chunk_local_relative"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/lingbot-va-inhouse-bimanual-earphone"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/pretrain_0620_earphone_lingbotva_posttrain_4056_8gpu_fastwam_shared"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/pretrain_0620_earphone_resum2000_lingbotva_posttrain_4056_8gpu_fastwam_shared"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/dualearphone_8x8x1_8000pre"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/pretrain_0620_dualearphone_resum2000_lingbotva_posttrain_4056_8gpu_fastwam_shared"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/0623ckpt/dualearphone_single8gpu1ga_12000pre_dropvideo"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/0623ckpt/giftbox_single8gpu1ga_12000pre_dropvideo"
    #ckpt_path: "/home/noematrix/lingbotva_ckpts/0624ckpt/giftbox_single8gpu1ga_dropvideo_1057fixed"
    # ckpt_path: "/home/noematrix/lingbotva_ckpts/0623ckpt/earphone_single8gpu1ga_12000pre_dropvideo"

    # 0625 test
    #ckpt_path: "/home/noematrix/lingbotva_ckpts/0625ckpt/giftbox_single8gpu1ga_dropvideo0.8_1758episodes_12000pre"
    #ckpt_path: "/home/noematrix/lingbotva_ckpts/0625ckpt/giftbox_single8gpu1ga_dropvideo_1057fixed"

    # 0626 test
    ckpt_path: "/home/noematrix/lingbotva_ckpts/0626ckpt/giftbox_8node8gpu1ga_ws3-16_1758ep_12000pre_dropvideo"

    host: 127.0.0.1
    port: 18080


    # task: |-
    #   Hardware: 310
    #   Dataset: datasets_dualearphone_0620_356episodes_0.2.21
    #   FPS: 10
    #   Action Space: state; 23d total; 7d left arm eef pose; 1d left gripper; 7d right arm eef pose; 1d right gripper; 7d head eef pose
    #   Task: Place the Bluetooth earphones into the magic cup

    task: |-
      Hardware: 310
      Dataset: datasets_giftbox_0621_1758episodes_0.2.21
      FPS: 10
      Action Space: state; 23d total; 7d left arm eef pose; 1d left gripper; 7d right arm eef pose; 1d right gripper; 7d head eef pose
      Task: Place the lanyard into the gift box

    device: "cuda"
    camera_devices: # mapping from camera_devices to model_camera_keys
      - "WebCameraDevice_0"
      - "WebCameraDevice_1"
    model_camera_keys:
      - observation.images.wrist_image_1
      - observation.images.wrist_image_2
    robot_device: RizonRobot_2

    param_dtype: bf16
    attn_mode: flashattn
    enable_offload: false
    offload_vae: false
    offload_text_encoder: true
    stateless_reset_each_predict: false
    block: true
    zero_action_condition: false

    # History KV-cache anchoring: wait until the arm physically reaches the last action
    # pose of the chunk, then sample images + robot poses backward from that moment.
    history_anchor_mode: now            # "arrival" | "now" (legacy forward-from-predict)
    # history_now_base_offset_ns: 100000000
    history_now_base_offset_ns: 0
    history_now_last_keyframe_offset_ns: 200000000
    history_arrival_pos_tolerance_m: 0.01   # position tolerance (meters) for arrival
    history_arrival_rot_tolerance_rad: 0.2  # orientation tolerance (radians) for arrival
    history_arrival_timeout_s: 1.0          # give up waiting and anchor at "now" after this
    history_state_from_robot_pose: true     # build compute_kv_cache state from actual poses
    history_manual_selection:
      enabled: false
      window_ms: 600.0
      max_candidates_per_step: 15
      timeout_s: 0.0
      auto_open_browser: true
      port: 0
      save_dir: /tmp/superinference_manual_history_picker

    gripper_max_width: 0.11
    normalize_gripper_width: false
    print_predicted_gripper_action: true
    # TODO(remove hack): gripper command close-bias hack is configured in
    # configs/devices/infer/rizon_dual_eef_abs_fisheye_webcam.yaml under gripper.command_offset.

    # crop 360x640 -> 360x270, then resize to hxw=320x240
    reshape_mode: crop_resize
    center_crop_before_resize: false
    crop_before_resize:
      - 185
      - 185
      - 0
      - 0
    crop_resize_size:
      - 320
      - 240
    pad_after_resize: null

    frame_chunk_size: 4 # 2
    # attn_window: 30
    attn_window: 4
    guidance_scale: 5.0
    action_guidance_scale: 1.0
    num_inference_steps: 10 # 25
    action_num_inference_steps: 10 # 50

    save_root: /home/noematrix/SuperInference.lingbotva/logs/runs
    save_predicted_video_latents: True
    save_history_cache_latents: false
    decoded_latent_save_dir: /home/noematrix/SuperInference.lingbotva/logs/decoded_lingbot_latents

  fps: 100
  control_fps: 30.0 # 30.0
  chunk_length: 48 # 24

  obs:
    devices:
      - "WebCameraDevice_0"
      - "WebCameraDevice_1"
      - RizonRobot_2

  controls:
    - endpoint:
        device: RizonRobot
        device_class_id: 2
        port: command
      shape:
        - 16
      dtype: float64

  infer_rollout:
    enabled: false
    episode_control:
      enabled: true
      success_key: "s"
      failure_key: "f"
      discard_key: "d"
      auto_restart: true
      home_wait_time: 6.0
      halt_settle_time: 0.5
      policy_runner_reset_timeout: 1.0

  history_video:
    enabled: true
    save_dir: /home/noematrix/SuperInference.lingbotva/logs/0624_history_keyframes
