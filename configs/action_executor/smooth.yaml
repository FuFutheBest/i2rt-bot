action_executor:
  type: base_policy_runner
  robot_control_shms: ${policy.controls}
  execution_fps: ${policy.control_fps}
  chunk_length: ${policy.chunk_length}
  signal_files: ${runtime.signal_files}
  chunk_manager:
    type: smooth_chunk_manager
    drop_first_actions: auto
    smoothing:
      method: savgol
      window: 5
      polyorder: 2
      upsample_ratio: 1
      smooth_gripper: false
    upsampling:
      method: null
