enable_visualizers: false
enable_device_manager: true
# Global default for camera overlay image blending
# Can be overridden per device in device config with enable_overlay: true/false
camera_overlay_enabled: false

# Signal file patterns for multiprocessing communication
# These files are used for coordination between device_starter, consumers, devices, and policy_runner
signal_files:
  reset_signal: "/tmp/superinference_reset_signal"
  robot_home_index: "/tmp/superinference_robot_home_index"
  episode_signal_pattern: "/tmp/superinference_episode_{signal}"
  robot_home_command_pattern: "/tmp/superinference_robot_{device_name}_{device_class_id}_home_command"
  robot_teleop_start_command_pattern: "/tmp/superinference_robot_{device_name}_{device_class_id}_teleop_start_command"
  robot_teleop_discard_command_pattern: "/tmp/superinference_robot_{device_name}_{device_class_id}_teleop_discard_command"
  start_recording: "/tmp/superinference_start_recording"
  stop_recording: "/tmp/superinference_stop_recording"
  episode_result: "/tmp/superinference_episode_result"
  policy_runner_reset_command: "/tmp/superinference_policy_runner_reset_command"
  teleoperator_reset_command: "/tmp/superinference_teleoperator_reset_command"
  rollout_ready: "/tmp/superinference_rollout_ready"
  robot_reconnect: "/tmp/superinference_robot_reconnect"
  robot_halt_command_pattern: "/tmp/superinference_robot_{device_name}_{device_class_id}_halt_command"
  robot_halt_reply_pattern: "/tmp/superinference_robot_{device_name}_{device_class_id}_halt_reply"
  i2rt_random_home_request: "/tmp/superinference_i2rt_random_home_request.json"
  i2rt_random_home_target: "/tmp/superinference_i2rt_random_home_target.json"
  i2rt_random_home_result_pattern: "/tmp/superinference_i2rt_random_home_result_{device_class_id}.json"
  i2rt_takeover_hold_request: "/tmp/superinference_i2rt_takeover_hold_request.json"
  i2rt_takeover_hold_ack: "/tmp/superinference_i2rt_takeover_hold_ack.json"

# PolicyConnector enables request/result barriers only for a config that opts
# into the synchronized I2RT randomized-home protocol.
i2rt_random_home_sync_enabled: false

# CPU affinity for DeviceStarter subprocesses (optional).
# profile: auto (12-core / 8-core presets) | 12cpu | 8cpu | custom
# Set enabled: false to disable pinning entirely.
cpu_affinity:
  enabled: true
  min_cpus: 8
  profile: auto
  # custom example (use profile: custom):
  # custom:
  #   device_starter_main: [0, 1]
  #   device_manager: [0, 1]
  #   policy_runner: [2, 3, 4]
  #   visualizer: [7]
  #   device_default: [0, 1, 2, 3, 4]
  #   devices:
  #     RizonRobot: [8, 9, 10, 11]
  #     HikCameraDevice: [5, 6]
