defaults:
  - devices: default
  - device_manager: sync
  - action_executor: default
  - consumer: default
  - runtime: default
  - _self_

device_manager:
  device_manager:
    master_device_class_id: 0
    params:
      config_path: ${oc.env:SUPERINFERENCE_RESOLVED_CONFIG_PATH,config_resolved.yaml}
      buffer_size: 100

shared:
  summary_shm_name: device_summary_data
  default_camera_shape: [480, 640, 3]
  camera_dtype: uint8

global_settings:
  log_level: INFO
  restart_on_failure: true
  max_restart_attempts: 3
  restart_delay: 2.0

hydra:
  run:
    dir: .
  output_subdir: null
